<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>行政抄表</title>
<style>
:root { --teal:#0f766e; --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif; background:#f5f5f4; color:var(--ink); }
.top { background:#134e4a; color:#f0fdfa; padding:12px 16px 14px; }
.top h1 { margin:0; font-size:16px; font-weight:650; }
.top .sub { margin-top:4px; font-size:12px; color:#99f6e4; }
.wrap { max-width:480px; margin:0 auto; padding:12px 14px 28px; }
.progress { height:6px; background:#d6d3d1; border-radius:99px; overflow:hidden; margin:10px 0 8px; }
.progress i { display:block; height:100%; background:#2dd4bf; width:0; }
.meta { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:10px; }
.room { font-size:48px; font-weight:800; letter-spacing:.04em; margin:0; }
.badge { display:inline-block; font-size:12px; background:#ecfdf5; color:#115e59; padding:2px 8px; border-radius:99px; margin-left:6px; }
.last { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:12px 0; }
.last div { background:#f5f5f4; border-radius:10px; padding:8px; text-align:center; }
.last span { display:block; font-size:11px; color:var(--muted); }
.last b { font-size:18px; font-variant-numeric:tabular-nums; }
label { display:block; margin-top:10px; font-size:13px; color:var(--muted); }
input { width:100%; font-size:28px; font-variant-numeric:tabular-nums; padding:10px 12px; border:1px solid var(--line); border-radius:12px; outline:none; }
input:focus { border-color:var(--teal); }
.warn { background:#fff7ed; color:#9a3412; padding:8px 10px; border-radius:10px; font-size:13px; margin-top:10px; }
.nav { display:grid; grid-template-columns:1fr 1.4fr 1fr; gap:8px; margin-top:14px; }
.nav button, .btn { border:0; border-radius:12px; padding:14px 8px; font-size:16px; font-weight:650; }
.nav .prev, .nav .skip { background:#fff; color:var(--teal); border:1px solid #99f6e4; }
.nav .next { background:var(--teal); color:#fff; }
.floors { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.floors button { border:1px solid var(--line); background:#fff; border-radius:99px; padding:6px 10px; font-size:13px; }
.floors button.on { background:#134e4a; color:#fff; border-color:#134e4a; }
.tools { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.tools button { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:14px; }
.ok { color:#15803d; font-size:13px; margin-top:8px; }
</style>
</head>
<body>

  <h1>宿舍水电抄表（行政）</h1>
  <div class="sub">按楼层顺序登记本月读数。无需拍照。数据保存在本机，可导出。</div>
</div>
<div class="wrap">
  <div class="meta"><span id="progText">0 / 112</span><span id="doneText">已登记 0</span></div>
  <div class="progress"><i id="bar"></i></div>
  <div class="floors" id="floors"></div>

    <div class="last">

      <div><span>上月热水</span><b id="lh">—</b></div>
    </div>
    <label>本月电表</label>
    <input id="elec" inputmode="decimal" autocomplete="off">
    <label>本月冷水表</label>
    <input id="cold" inputmode="decimal" autocomplete="off">
    <label>本月热水表</label>
    <input id="hot" inputmode="decimal" autocomplete="off">
    <div class="warn" id="warn" hidden></div>
    <div class="nav">

      <button class="next" type="button" id="next">保存并下一间</button>
      <button class="skip" type="button" id="copyLast">沿用上月</button>
    </div>
  </div>
  <div class="tools">
    <button type="button" id="export">导出本月读数</button>
    <button type="button" id="jumpUn">跳到未登记</button>
  </div>
  <p class="ok" id="msg"></p>

const KEY = "dorm-walk-2026-09";
function load(){ try { return JSON.parse(localStorage.getItem(KEY)||"{}"); } catch(e){ return {}; } }
function saveAll(data){ localStorage.setItem(KEY, JSON.stringify(data)); }
let data = load();
let idx = 0;
function n(v){ return (v===0 || v) ? String(v) : "—"; }
function filled(i){
  const r = ROOMS[i].room;
  const d = data[r]||{};
  return d.elec!=="" && d.elec!=null && d.cold!=="" && d.cold!=null && d.hot!=="" && d.hot!=null;
}
function countFilled(){ return ROOMS.filter((_,i)=>filled(i)).length; }
function show(){
  const r = ROOMS[idx];
  document.getElementById("roomNo").innerHTML = r.room + (r.special? '<span class="badge">'+r.special+"</span>":"");
  document.getElementById("le").textContent = n(r.last_elec);
  document.getElementById("lc").textContent = n(r.last_cold);
  document.getElementById("lh").textContent = n(r.last_hot);
  const d = data[r.room]||{};
  document.getElementById("elec").value = d.elec!=null? d.elec : "";
  document.getElementById("cold").value = d.cold!=null? d.cold : "";
  document.getElementById("hot").value = d.hot!=null? d.hot : "";
  checkWarn();
  const cf = countFilled();
  document.getElementById("progText").textContent = (idx+1)+" / "+ROOMS.length;
  document.getElementById("doneText").textContent = "已登记 "+cf;
  document.getElementById("bar").style.width = (cf/ROOMS.length*100)+"%";
  document.querySelectorAll(".floors button").forEach(function(b,i){
    b.className = (Math.floor(r.room/100)===(i+3)?"on":"");
  });
}
function checkWarn(){
  const r = ROOMS[idx];
  const elec = parseFloat(document.getElementById("elec").value);
  const cold = parseFloat(document.getElementById("cold").value);
  const hot = parseFloat(document.getElementById("hot").value);
  const msgs = [];
  if (!isNaN(elec) && r.last_elec!=null && elec < r.last_elec) msgs.push("电表本月小于上月，请确认是否换表");
  if (!isNaN(cold) && r.last_cold!=null && cold < r.last_cold) msgs.push("冷水本月小于上月，请确认是否换表");
  if (!isNaN(hot) && r.last_hot!=null && hot < r.last_hot) msgs.push("热水本月小于上月，请确认是否换表");
  const w = document.getElementById("warn");
  if (msgs.length){ w.hidden=false; w.textContent=msgs.join("；"); }
  else w.hidden=true;
}
function persist(){
  const r = ROOMS[idx].room;
  data[r] = {
    elec: document.getElementById("elec").value.trim(),
    cold: document.getElementById("cold").value.trim(),
    hot: document.getElementById("hot").value.trim()
  };
  saveAll(data);
}
function go(d){
  persist();
  idx = Math.max(0, Math.min(ROOMS.length-1, idx+d));
  show();
  document.getElementById("elec").focus();
}
document.getElementById("prev").onclick=function(){ go(-1); };
document.getElementById("next").onclick=function(){ persist(); if(idx<ROOMS.length-1) go(1); else { document.getElementById("msg").textContent="全部房间已浏览，请导出本月读数。"; } };
document.getElementById("copyLast").onclick=function(){
  const r = ROOMS[idx];
  document.getElementById("elec").value = r.last_elec;
  document.getElementById("cold").value = r.last_cold;
  document.getElementById("hot").value = r.last_hot;
  checkWarn(); persist();
};
["elec","cold","hot"].forEach(function(id){
  document.getElementById(id).addEventListener("input", checkWarn);
});
document.getElementById("hot").addEventListener("keydown", function(e){
  if(e.key==="Enter"){ e.preventDefault(); document.getElementById("next").click(); }
});
const fl = document.getElementById("floors");
for(let f=3;f<=9;f++){
  const b=document.createElement("button");
  b.type="button"; b.textContent=f+"楼";
  b.onclick=function(){ persist(); idx = ROOMS.findIndex(function(r){return Math.floor(r.room/100)===f;}); show(); };
  fl.appendChild(b);
}
document.getElementById("jumpUn").onclick=function(){
  persist();
  const j = ROOMS.findIndex(function(_,i){return !filled(i);});
  if(j<0){ document.getElementById("msg").textContent="112 间均已登记。"; return; }
  idx=j; show();
};
document.getElementById("export").onclick=function(){
  persist();
  let csv = "\ufeff宿舍号,上月电表,本月电表,上月冷水,本月冷水,上月热水,本月热水,备注\n";
  ROOMS.forEach(function(r){
    const d=data[r.room]||{};
    csv += [r.room,r.last_elec,d.elec||"",r.last_cold,d.cold||"",r.last_hot,d.hot||"",r.special||""].join(",")+"\n";
  });
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="宿舍水电抄表_2026-09.csv";
  a.click();
  document.getElementById("msg").textContent="已导出 CSV，可用 Excel 打开后粘贴到水电明细。";
};
show();

</html>
